# 客戶價值中心

## 定位與原則
### 核心主張
- 把獨立產品併成一個私有雲平台，模組可選購，客戶資料只有一份
### 背景與時機
- 打房後建商只為「帶來成交」與「省廣告費」付錢
- 分散系統做不到從舊客找真買方
### 三原則
- 模組可單買，資料核心與 LINE 入口是底座
- 現有系統照用；先把各系統接進現有 CDP，再統一登入與 LINE 入口，最後收攏畫面
- 私有雲，資料不出門；對外只送受眾輪廓，付費請外部數據中心推播

## 客戶價值週期（八階段）
### 1 來人／潛客
- 銷售管理・CDP 篩選
- 留：手機、LINE UID、需求、自備款、名下有無房
### 2 成交／簽約
- 銷售管理（銷控、付款；合約管理暫不納入）
- 留：戶別、總價、貸款成數、共同持有人
### 3 工程期
- 工程建造履歷（新建，其他模組皆有現成產品）
- 留：節點、照片、驗收
### 4 客變
- 客變管理
- 留：項目、金額、簽認
### 5 驗屋
- 驗屋 App
- 留：缺失、照片、複驗
### 6 點交／交屋（資料落地點）
- 點交 App
- 留：清單、保固起算日、住戶 LINE
### 7 售後／保固
- 售後服務（報修、保固、清潔）、文字客服、AI 客服
- 留：報修、時效、滿意度
### 8 住戶生活／再行銷
- CDP 進階・自動化旅程・住戶服務
- 留：換屋訊號（行為推得，不另收個資）、互動、推薦

## 五層架構
### L1 觸點層
- LINE 官方帳號（住戶單一入口，一建商一帳號）
- 建商後台 Web（業務、工務、客服）
- 驗屋 App・點交 App
- 案場平板
### L2 業務模組層（可選購）
- 銷售管理
- 工程履歷（新建）
- 客變
- 驗屋
- 點交
- 售後服務
- 客服（文字客服、AI 客服）
- 住戶服務
### L3 客戶資料核心＝現有 CDP（必備，不另建）
- 客戶主檔：同一個人在各系統只算一筆，用手機號認人，LINE、Email 輔助
- 戶別主檔：案、棟、戶、坪數、交屋日；一人可多戶、一戶可多人
- 客戶時間軸：每個系統發生的事都記一筆（誰、何時、哪戶、做了什麼）
- 標籤與分群：首購、持有年數、近期點擊等
- 同意紀錄：客戶同意過哪些用途，決定能不能拿他做行銷
### L4 分析與行銷層（規則為主，AI 只在加值）
- 受眾輪廓（規則統計，不需 AI；見「舊客與新客的分工」）
- 舊客再行銷：推薦、開案前來人篩選、換屋名單（規則）
- 自動化旅程（規則觸發，不需 AI）
- AI 加值（可選購）：受眾輪廓分析、分群文案生成、AI 客服
### L5 數據協作層（資料不出門，只送輪廓）
- 受眾輪廓：從自家成交客歸納的一組條件（年齡帶、區域、首購／換屋、可負擔總價）
- 送出的只有條件單，沒有任何客戶資料
- 外部數據中心用自己的會員篩人、自己推播，建商付費
- 有人點擊、留單、加 LINE 才進建商 CDP；成效以彙總數回收
### 共用基礎（所有模組都靠它）
- 一家建商一套系統；或多家共用一套但資料隔開
- 帳號權限：誰能登入、看哪些案、改什麼
- 統一門口：各系統與 LINE、外部數據中心進出的單一接口
- 操作紀錄：誰在何時看過、匯出過哪些客戶資料
- 安裝包：裝進建商自己機房或雲端的一鍵安裝

## 模組包
### 基礎底座（必附）
- 現有 CDP、LINE 入口、帳號權限、部署
### 銷售包
- 銷售管理、開案前歷年來人篩選
### 工程包
- 工程履歷（新建）、客變
### 交屋包
- 驗屋 App、點交 App
### 服務包
- 售後服務、保固、文字客服、AI 客服、住戶服務
### 成長包
- CDP 進階、自動化旅程、受眾輪廓輸出與外部推播對接；內容生成為加購
### 資料契約
- 每個模組必須定義寫入事件流的事件

## 整併路徑（四步，畫面不動先接資料）
### 現況
- 除工程履歷外都有現成產品；工程履歷排第 ④ 步新建
- 問題：UI 風格各異、彼此沒串、客戶在每個系統各一筆
- UI 風格一致：先定一套版型與元件，新做的畫面直接用，舊畫面重做時才換，不一次全換皮
### ① 各系統接進 CDP（0–3 月）
- 盤點 CDP 三件事：戶別維度、事件寫入介面、LINE UID 合併，缺的補進 CDP
- 驗屋、點交、售服各加一支同步程式，存資料時同步寫進 CDP
- CDP 加查詢頁，輸手機號看跨系統時間軸
- 定一套 UI 版型與元件（設計稿）
- 使用者：工務、客服、住戶操作不變
- 住戶甲 3/1 點交、3/15 報修，客服一頁看到兩筆紀錄
- 可賣：交屋包＋服務包
#### 兩種接法（畫面不動）
- 主線：各系統後端加一支寫出程式，存資料時同步送 CDP，即時、操作不變
- 備案：排程批次讀各系統資料庫轉成事件，延遲 15 分到 1 天；用於歷史回填與無原始碼系統
- 前提：CDP 有事件接收介面（第 1 個月盤點）
#### 第 2 個月逐週
- 週 1：CDP 接收介面就位、欄位對照表定稿
- 週 2：歷史資料批次回填，看身分合併比率
- 週 3：四系統後端加寫出程式，測試環境跑通
- 週 4：試點交屋案正式跑，新增的只有 CDP 查詢頁
- 點交時取得住戶 LINE：第 ① 步用實體 QR code 卡片，不改 app；第 ③ 步重做時做進點交完成畫面
### ② 一組帳號、一個 LINE（3–6 月）
- 建商員工單一登入，住戶所有事都在同一個 LINE 選單
- 銷售、客變接進資料庫；受眾輪廓第一版；開案前來人篩選
- 使用者：行銷主管看到輪廓報告；業務開案前拿到來人名單
- 建商甲成交客 62% 現居三區、71% 總價 1,500–2,000 萬、首購 55%，寫成條件單（示意）
- 可賣：銷售包
### ③ 新功能只做在平台站台，舊畫面逐個退場（6–9 月）
- 平台＝一個獨立站台（後台＋各模組程式），CDP 是它的資料層；模組透過 CDP 介面讀寫，不寫進 CDP 內部
- 最少人用的舊後台先用統一風格重做，做完關閉舊系統
- 第一家外部數據中心完成對接與投放測試
- 售服舊後台第一個下線
- 可賣：成長包
### ④ 新建工程履歷（9–12 月）
- 沒有現成產品，排最後：前三步先收費，再投入新開發
- 直接在平台站台開發，走 CDP 介面，第一版就採統一風格
- 工務在後台登記節點與照片，對應到案、棟、戶
- 住戶在 LINE 看自己那一戶的進度與照片，節點完成時推播
- 工程事件寫進 CDP 時間軸，與客變、驗屋、點交接續
- 可賣：工程包（工程履歷＋客變）

## 外部數據協作（付費用外部第一方受眾）
### 原則
- 建商的客戶資料留在私有雲內，不外送
### 流程
- 自家 CDP 歸納真買方輪廓，例如 30–45 歲、某三區、首購或持有滿 8 年、總價 1,500–2,000 萬
- 把輪廓寫成條件單送給數據中心，不含名單、手機、代碼
- 數據中心在自己的會員裡篩人
- 由數據中心的 LINE／App／簡訊／廣告位推播，建商付費
- 點擊、留單、加 LINE 的人才進建商 CDP
- 觸達、點擊、留單以彙總數回報，修正下一輪輪廓
### 分工
- 我們：算輪廓、送條件單、接留單、量成效
- 數據中心：篩人、推播、回報彙總數
### 合作對象：先問真買方此刻在哪，再找誰手上有這群人
- 正在看房、查實價登錄、看裝潢文章：房產平台、裝潢媒體（第一批）
- 住在新案附近或在附近上班：電信業者的居住地與工作地（第一批）
- 家庭正在變大，結婚、生子、換車、買家電：婚宴與月子中心、汽車家電會員、百貨量販會員（第二批）
- 已住鄰近社區、屋齡到換屋期：物業管理公司、社區 App（第二批）
- 手上有資金考慮配置房產：銀行理財、保險、券商（觀察，法規門檻最高）
- 各類是否接條件單、怎麼收費，尚未查證

## 舊客與新客的分工
### 新舊客都重要：舊客算輪廓與再行銷，新客靠外部數據夥伴
### 舊客用途一：算受眾輪廓
- 正樣本：成交客；對照組：未成交來人；補充：住戶
- 條件單欄位：年齡帶、地緣行政區、總價帶、首購或換屋、自住或置產、看房行為
- 第一版規則統計：比較成交客與未成交來人的分佈差異
- AI 加值版找交叉特徵，例如 30–40 歲＋現居 B 區＋看過兩案，成交率三倍
- 條件單不含個資，行銷主管審過再送夥伴
- 外部留單進 CDP 成新來人，成交後回到正樣本
### 舊客用途二：再行銷
- 歷年來人：開案前依地緣與預算篩一次，潛銷期每週更新，通話後回填
- 已購客與住戶：推薦親友，住戶服務維持互動
- 交屋滿 7–10 年：換屋名單，新案有對應總價帶再聯絡
- 不做每日評分與分級，建商一年一到兩案，開案前產出即可
### 新客：外部數據夥伴
- 成效以留單進 CDP 的人數與成本計，不以曝光計
- 留單後回到銷售管理的來人流程

## AI 加值（可選購，不放主流程）
### 輪廓交叉特徵分析：在規則統計之上找交叉條件，寫進條件單
### 分群文案生成：依輪廓與階段產生 LINE 圖卡文案，人審後發
### AI 客服：現有產品，接 CDP 後認得出哪戶，回答帶工程進度與報修狀態

## 商業模式與路線
### 客群
- 建商第一（跨案續約）
- 代銷第二（銷售包＋成長包）
### 里程碑（12 個月）
- 1 月：盤點 CDP 三件事、事件字典、UI 版型、選試點
- 3 月：四系統接進 CDP，試點交屋案運行一個月，修正對照與合併規則
- 6 月：統一 LINE 與帳號，受眾輪廓第一版，開案前來人篩選，銷售與客變接入，銷售包開賣
- 9 月：第一個舊後台下線，自動化旅程，第一檔外部推播，成長包開賣
- 12 月：工程履歷第一版上線，工程包開賣，第二家建商
- 前提：團隊全職、CDP 三件事已具備；要補則第 ① 步各加約 1 月
### 指標
- 交屋 LINE 加好友率
- 報修處理時效
- 外部推播每筆留單成本與到場率
- 開案前來人名單接通率、到場率
- 舊客與住戶推薦占來人比例
